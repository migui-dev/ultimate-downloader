# ---------------------------------------------------------------- errores traducidos
error.enlace_no_valido.mensaje = The link is not valid or is not supported.
error.enlace_no_valido.sugerencia = Check that you pasted the full address of the video.
error.privado.mensaje = The video is private.
error.privado.sugerencia = It can only be downloaded if your account has access: try using the browser cookies.
error.solo_miembros.mensaje = The video is for channel members only.
error.solo_miembros.sugerencia = Sign in in your browser and turn on cookies in the settings.
error.restriccion_edad.mensaje = The video is age-restricted.
error.restriccion_edad.sugerencia = Turn on your browser cookies in the settings so YouTube accepts the download.
error.no_eres_robot.mensaje = YouTube is asking you to confirm you are not a bot.
error.no_eres_robot.sugerencia = Other YouTube players have already been tried. If it keeps asking, use a cookies.txt file from a signed-in session: Settings, «Browser cookies».
error.no_disponible_pais.mensaje = The video is not available in your country.
error.no_disponible_pais.sugerencia = It cannot be downloaded from this location.
error.no_disponible.mensaje = The video is not available: it may have been removed.
error.no_disponible.sugerencia = Check that the link still works in your browser.
error.emision_no_empezada.mensaje = The stream has not started yet.
error.emision_no_empezada.sugerencia = Try again once the live stream or premiere has begun.
error.drm.mensaje = The video is DRM-protected and cannot be downloaded.
error.drm.sugerencia = This app does not bypass copy protection.
error.sin_conexion.mensaje = There is no connection to YouTube.
error.sin_conexion.sugerencia = Check your internet connection and try again.
error.sin_espacio.mensaje = There is no space left on the disk.
error.sin_espacio.sugerencia = Free up space or choose another destination folder.
error.sin_permisos.mensaje = There is no permission to write in the destination folder.
error.sin_permisos.sugerencia = Choose another folder, for instance inside your user folder.
error.falta_ffmpeg.mensaje = ffmpeg cannot be found, and it is needed to join video and audio.
error.falta_ffmpeg.sugerencia = Download it from the settings or set its path by hand.
error.ffmpeg_fallo.mensaje = ffmpeg failed while processing the file.
error.ffmpeg_fallo.sugerencia = Try another container (MKV takes any codec) or re-encode to H.264 + AAC.
error.demasiadas_peticiones.mensaje = YouTube is rate-limiting requests from your connection.
error.demasiadas_peticiones.sugerencia = Wait a few minutes before trying again.
error.formato_no_disponible.mensaje = The format you chose is no longer available.
error.formato_no_disponible.sugerencia = Analyse the link again to refresh the list of formats.
error.ytdlp_desactualizado.mensaje = YouTube has changed something and this version of yt-dlp cannot read the video.
error.ytdlp_desactualizado.sugerencia = Click «Update yt-dlp» in the settings and try again.
error.error_403.mensaje = YouTube rejected the download (error 403).
error.error_403.sugerencia = Analyse the link again; if it keeps failing, update yt-dlp.
error.archivo_en_uso.mensaje = The file is in use by another program.
error.archivo_en_uso.sugerencia = Close the player or the program that has it open and try again.
error.fallo_con_codigo = The download failed (code {0}).
error.fallo = The download failed.
error.consulta_el_registro = Check the log for the technical details.
error.no_se_encuentra_archivo = The file or folder cannot be found.
error.comprueba_la_ruta = Check the path in the settings.
error.sin_internet = There is no internet connection.
error.revisa_la_conexion = Check your connection and try again.
error.cancelada = The operation was cancelled.
error.inesperado_titulo = Unexpected error
error.inesperado = Something unexpected went wrong.
error.inesperado_sugerencia = The app is still running. The details are in the log.

