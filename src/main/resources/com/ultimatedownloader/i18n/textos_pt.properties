error.cookies_cifradas.mensaje = Não foi possível ler as cookies do navegador: estão cifradas.
error.cookies_cifradas.sugerencia = O Chrome e o Edge cifram as cookies desde a versão 127 e nenhum programa as consegue ler. Exporta um ficheiro cookies.txt e escolhe-o nas definições, ou usa o Firefox.
error.cookies_navegador_abierto.mensaje = Não foi possível ler as cookies: o navegador tem o ficheiro bloqueado.
error.cookies_navegador_abierto.sugerencia = Fecha o navegador por completo e tenta de novo, ou usa um ficheiro cookies.txt.
error.cookies_sin_perfil.mensaje = Não se encontra o perfil do navegador com as cookies.
error.cookies_sin_perfil.sugerencia = Indica a pasta do perfil nas definições; o Opera GX e os perfis secundários não estão onde se procura por omissão.
