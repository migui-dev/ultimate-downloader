# ---------------------------------------------------------------- errores traducidos
error.enlace_no_valido.mensaje = Link jest nieprawidłowy albo nieobsługiwany.
error.enlace_no_valido.sugerencia = Sprawdź, czy wkleiłeś pełny adres filmu.
error.privado.mensaje = Film jest prywatny.
error.privado.sugerencia = Da się go pobrać tylko wtedy, gdy twoje konto ma dostęp: spróbuj plików cookie przeglądarki.
error.solo_miembros.mensaje = Film jest tylko dla członków kanału.
error.solo_miembros.sugerencia = Zaloguj się w przeglądarce i włącz pliki cookie w ustawieniach.
error.restriccion_edad.mensaje = Film ma ograniczenie wiekowe.
error.restriccion_edad.sugerencia = Włącz pliki cookie przeglądarki w ustawieniach, żeby YouTube zgodził się na pobranie.
error.no_eres_robot.mensaje = YouTube prosi o potwierdzenie, że nie jesteś robotem.
error.no_eres_robot.sugerencia = Inne odtwarzacze YouTube już wypróbowano. Jeśli nadal pyta, użyj pliku cookies.txt z zalogowanej sesji: ustawienia, «Ciasteczka przeglądarki».
error.no_disponible_pais.mensaje = Film nie jest dostępny w twoim kraju.
error.no_disponible_pais.sugerencia = Z tego miejsca nie da się go pobrać.
error.no_disponible.mensaje = Film nie jest dostępny: mógł zostać usunięty.
error.no_disponible.sugerencia = Sprawdź, czy link nadal działa w przeglądarce.
error.emision_no_empezada.mensaje = Transmisja jeszcze się nie zaczęła.
error.emision_no_empezada.sugerencia = Spróbuj, gdy transmisja na żywo albo premiera się zacznie.
error.drm.mensaje = Film jest zabezpieczony DRM i nie da się go pobrać.
error.drm.sugerencia = Ta aplikacja nie omija zabezpieczeń przed kopiowaniem.
error.sin_conexion.mensaje = Brak połączenia z YouTube.
error.sin_conexion.sugerencia = Sprawdź połączenie z internetem i spróbuj ponownie.
error.sin_espacio.mensaje = Na dysku nie ma już miejsca.
error.sin_espacio.sugerencia = Zwolnij miejsce albo wybierz inny folder docelowy.
error.sin_permisos.mensaje = Brak uprawnień do zapisu w folderze docelowym.
error.sin_permisos.sugerencia = Wybierz inny folder, na przykład wewnątrz swojego folderu użytkownika.
error.falta_ffmpeg.mensaje = Nie znaleziono ffmpeg, a jest potrzebny do połączenia obrazu z dźwiękiem.
error.falta_ffmpeg.sugerencia = Pobierz go w ustawieniach albo wskaż ścieżkę ręcznie.
error.ffmpeg_fallo.mensaje = ffmpeg nie poradził sobie z plikiem.
error.ffmpeg_fallo.sugerencia = Spróbuj innego kontenera (MKV przyjmuje każdy kodek) albo przekoduj na H.264 + AAC.
error.demasiadas_peticiones.mensaje = YouTube ogranicza zapytania z twojego łącza.
error.demasiadas_peticiones.sugerencia = Odczekaj kilka minut i spróbuj ponownie.
error.formato_no_disponible.mensaje = Wybrany format nie jest już dostępny.
error.formato_no_disponible.sugerencia = Przeanalizuj link ponownie, żeby odświeżyć listę formatów.
error.ytdlp_desactualizado.mensaje = YouTube coś zmienił i ta wersja yt-dlp nie potrafi odczytać filmu.
error.ytdlp_desactualizado.sugerencia = Kliknij „Zaktualizuj yt-dlp” w ustawieniach i spróbuj ponownie.
error.error_403.mensaje = YouTube odrzucił pobieranie (błąd 403).
error.error_403.sugerencia = Przeanalizuj link ponownie; jeśli dalej nie działa, zaktualizuj yt-dlp.
error.archivo_en_uso.mensaje = Plik jest używany przez inny program.
error.archivo_en_uso.sugerencia = Zamknij odtwarzacz albo program, który go otworzył, i spróbuj ponownie.
error.fallo_con_codigo = Pobieranie się nie udało (kod {0}).
