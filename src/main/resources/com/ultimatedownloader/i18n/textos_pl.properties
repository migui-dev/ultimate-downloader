error.consulta_el_registro = Szczegóły techniczne są w dzienniku.
error.no_se_encuentra_archivo = Nie znaleziono wskazanego pliku ani folderu.
error.comprueba_la_ruta = Sprawdź ścieżkę w ustawieniach.
error.sin_internet = Brak połączenia z internetem.
error.revisa_la_conexion = Sprawdź połączenie i spróbuj ponownie.
error.cancelada = Operacja została anulowana.
